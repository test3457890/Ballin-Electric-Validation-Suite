<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Proposed factory acceptance workflow</title><desc id="d">Inventory and diagnostics lead to stability tests and physical inspection. Any failed, unsupported or missing required test places the machine on hold; all required checks passing permits human release review.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52636e"/></marker></defs>
<rect width="1200" height="390" fill="#f1f3f4"/><rect x="0" width="1200" height="62" fill="#34434e"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="39" fill="#fff" font-size="23">Factory acceptance / proposed process</text><text x="1168" y="38" fill="#d2dbe0" text-anchor="end" font-size="13">PROCESS CONCEPT</text>
<g transform="translate(32 91)"><rect width="257" height="92" fill="white" stroke="#929ca4"/><rect width="257" height="24" fill="#d5d9dc"/><text x="11" y="17" font-size="12" fill="#34434e">STAGE 01</text><text x="13" y="50" font-size="21" fill="#202020">Inventory</text><text x="13" y="73" font-size="14" fill="#52636e">Verify build and IDs</text></g><g transform="translate(325 91)"><rect width="257" height="92" fill="white" stroke="#929ca4"/><rect width="257" height="24" fill="#d5d9dc"/><text x="11" y="17" font-size="12" fill="#34434e">STAGE 02</text><text x="13" y="50" font-size="21" fill="#202020">Diagnostics</text><text x="13" y="73" font-size="14" fill="#52636e">Component integrity</text></g><g transform="translate(618 91)"><rect width="257" height="92" fill="white" stroke="#929ca4"/><rect width="257" height="24" fill="#d5d9dc"/><text x="11" y="17" font-size="12" fill="#34434e">STAGE 03</text><text x="13" y="50" font-size="21" fill="#202020">Burn-in</text><text x="13" y="73" font-size="14" fill="#52636e">Controlled workloads</text></g><g transform="translate(911 91)"><rect width="257" height="92" fill="white" stroke="#929ca4"/><rect width="257" height="24" fill="#d5d9dc"/><text x="11" y="17" font-size="12" fill="#34434e">STAGE 04</text><text x="13" y="50" font-size="21" fill="#202020">Inspection</text><text x="13" y="73" font-size="14" fill="#52636e">Physical and I/O checks</text></g>
<g stroke="#52636e" stroke-width="1.7" fill="none" marker-end="url(#a)"><path d="M289 137H322"/><path d="M582 137H615"/><path d="M875 137H908"/><path d="M1039 183V210H600V233"/><path d="M600 276V291H290V310"/><path d="M600 276V291H910V310"/></g>
<rect x="430" y="233" width="340" height="43" fill="#d5d9dc" stroke="#929ca4"/><text x="600" y="260" text-anchor="middle" font-size="17" fill="#202020">Review all required evidence</text>
<rect x="32" y="310" width="516" height="55" fill="#f7e4e4" stroke="#bd1818"/><text x="50" y="332" font-size="16" fill="#a21c1c">HOLD / Investigate and retest</text><text x="50" y="352" font-size="13" fill="#503232">Failed, missing or unsupported required checks</text>
<rect x="652" y="310" width="516" height="55" fill="#e6f0e6" stroke="#26752a"/><text x="670" y="332" font-size="16" fill="#26752a">REVIEW / Human release approval</text><text x="670" y="352" font-size="13" fill="#314c32">All required checks pass; evidence reviewed</text></g></svg>