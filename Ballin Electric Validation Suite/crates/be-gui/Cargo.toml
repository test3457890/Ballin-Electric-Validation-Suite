[package]
name = "be-gui"
description = "FLTK-rs desktop interface for BE Validation (industrial theme)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Build a GUI that always runs in restricted customer mode.
customer-edition = []

[[bin]]
name = "bevalidate-gui"
path = "src/main.rs"

[dependencies]
be-core.workspace = true
be-platform.workspace = true
be-diagnostics.workspace = true
be-safety.workspace = true
be-storage.workspace = true
be-reporting.workspace = true
be-engine.workspace = true
fltk.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
