[workspace]
resolver = "3"
members = [
    "crates/be-core",
    "crates/be-platform",
    "crates/be-diagnostics",
    "crates/be-safety",
    "crates/be-storage",
    "crates/be-reporting",
    "crates/be-engine",
    "crates/be-worker",
    "crates/be-cli",
    "crates/be-gui",
    "crates/be-gpu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary-Unlicensed"
publish = false
authors = ["Ballin Electric"]

[workspace.dependencies]
be-core = { path = "crates/be-core" }
be-platform = { path = "crates/be-platform" }
be-diagnostics = { path = "crates/be-diagnostics" }
be-safety = { path = "crates/be-safety" }
be-storage = { path = "crates/be-storage" }
be-reporting = { path = "crates/be-reporting" }
be-gpu = { path = "crates/be-gpu" }
be-engine = { path = "crates/be-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
fltk = "1.5"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }

[profile.release]
# Keep line tables for readable crash backtraces without full debug info.
debug = "line-tables-only"
